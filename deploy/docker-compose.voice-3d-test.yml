# Standalone test stack. Never combine with production compose/env files.
name: windhub-voice3d-test
services:
  gateway:
    image: ${WXM_VOICE3D_TEST_IMAGE:?Set an immutable validated merged-main image}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:${WXM_VOICE3D_TEST_PORT:-48381}:8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: media_test
      DATABASE_DBNAME: windhub_media_test
      DATABASE_PASSWORD: ${WXM_VOICE3D_TEST_DB_PASSWORD:?Generate a new test-only DB secret}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      ADMIN_EMAIL: admin@windhub-voice3d.test
      ADMIN_PASSWORD: ${WXM_VOICE3D_TEST_ADMIN_PASSWORD:?Generate a new test-only admin secret}
      JWT_SECRET: ${WXM_VOICE3D_TEST_JWT_SECRET:?Generate a new test-only JWT secret}
      WXM_OFFICIAL_MEDIA_ENABLED: "false"
      GOMEMLIMIT: 384MiB
    volumes:
      - gateway_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:18.1-alpine
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_USER: media_test
      POSTGRES_DB: windhub_media_test
      POSTGRES_PASSWORD: ${WXM_VOICE3D_TEST_DB_PASSWORD:?Generate a new test-only DB secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_test -d windhub_media_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gateway_data:
  postgres_data:
  redis_data:
